# ─── CI/CD — Web Admin Next.js (@health/web-admin) ───────────────────────────
#
# Pipeline autonome — à configurer comme CI config path dans le projet GitLab :
#   Settings → CI/CD → General pipelines → CI/CD configuration file
#   → apps/web-admin/.gitlab-ci.yml
#
# Déclencheurs :
#   • Push sur n'importe quelle branche / MR   → test
#   • Push sur main                            → test + build (staging) + deploy staging
#   • Tag web-admin/v*.*.*                     → test + build (prod) + deploy production (manuel)
#
# Variables CI/CD à configurer (GitLab → Settings → CI/CD → Variables, masked + protected) :
#   SSH_PRIVATE_KEY                    — clé privée pour se connecter au serveur
#   DEPLOY_HOST                        — IP ou hostname du serveur
#   DEPLOY_USER                        — utilisateur SSH (ex : deploy)
#   DEPLOY_DIR                         — /opt/apps/doctor-patient
#   NEXT_PUBLIC_API_BASE_URL_STAGING   — URL API staging
#   NEXT_PUBLIC_API_BASE_URL_PROD      — URL API production
#   WEB_ADMIN_STAGING_URL              — URL publique staging
#   WEB_ADMIN_PROD_URL                 — URL publique production

stages:
  - test
  - build
  - staging
  - production

.web-admin-node-base:
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm install --no-frozen-lockfile

# ── SSH helper ────────────────────────────────────────────────────────────────

.ssh-before: &ssh-before
  - apk add --no-cache openssh-client bash
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - cat "$SSH_PRIVATE_KEY" > /tmp/id_deploy
  - echo >> /tmp/id_deploy
  - chmod 600 /tmp/id_deploy
  - ssh-add /tmp/id_deploy
  - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

# ── Validation README ─────────────────────────────────────────────────────────

validate:readme:web-admin:
  image: node:20-alpine
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
  script:
    - node scripts/validate-readme.js
  allow_failure: false

# ── Test ──────────────────────────────────────────────────────────────────────

test:web-admin:
  extends: .web-admin-node-base
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
  script:
    - pnpm test:run
  coverage: '/Lines\s*:\s*\d+\.?\d+%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

# ── Build image Docker (staging) ──────────────────────────────────────────────

build:web-admin:staging:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:web-admin"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/web-admin:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/web-admin:staging"
      --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_STAGING"
      --cache=true
      --cache-ttl=24h

build:web-admin:production:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:web-admin"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/web-admin:$CI_COMMIT_TAG"
      --destination "$CI_REGISTRY_IMAGE/web-admin:latest"
      --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_PROD"
      --cache=true
      --cache-ttl=24h

# ── Deploy staging ────────────────────────────────────────────────────────────

deploy:web-admin:staging:
  stage: staging
  image: alpine:3.19
  needs: ["build:web-admin:staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: web-admin/staging
    url: $WEB_ADMIN_STAGING_URL
  before_script:
    - *ssh-before
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
        "REGISTRY=$CI_REGISTRY \
         REGISTRY_USER=$CI_REGISTRY_USER \
         REGISTRY_PASSWORD=$CI_JOB_TOKEN \
         bash $DEPLOY_DIR/infra/scripts/deploy.sh web-admin $CI_COMMIT_SHORT_SHA"

# ── Deploy production ─────────────────────────────────────────────────────────

deploy:web-admin:production:
  stage: production
  image: alpine:3.19
  needs: ["build:web-admin:production"]
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
      when: manual
  environment:
    name: web-admin/production
    url: $WEB_ADMIN_PROD_URL
  before_script:
    - *ssh-before
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
        "REGISTRY=$CI_REGISTRY \
         REGISTRY_USER=$CI_REGISTRY_USER \
         REGISTRY_PASSWORD=$CI_JOB_TOKEN \
         bash $DEPLOY_DIR/infra/scripts/deploy.sh web-admin $CI_COMMIT_TAG"
