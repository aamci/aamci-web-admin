# ─── CI/CD — Web Admin Next.js (@health/web-admin) ───────────────────────────
#
# Inclus depuis le .gitlab-ci.yml racine via `include: local:`.
# Déclencheurs :
#   • MR vers main            → test
#   • Push sur main           → test + build image + deploy staging (auto)
#   • Tag web-admin/v*.*.*    → deploy production (manuel)
#
# Variables à configurer (GitLab → Settings → CI/CD → Variables) :
#   WEB_ADMIN_STAGING_DEPLOY_HOOK      URL webhook staging
#   WEB_ADMIN_PROD_DEPLOY_HOOK         URL webhook production
#   NEXT_PUBLIC_API_BASE_URL_STAGING   URL API pour l'image staging
#   NEXT_PUBLIC_API_BASE_URL_PROD      URL API pour l'image production

.web-admin-node-base:
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm install --frozen-lockfile

# ── Test ──────────────────────────────────────────────────────────────────────

test:web-admin:
  extends: .web-admin-node-base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web-admin/**/*
        - pnpm-workspace.yaml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/web-admin/**/*
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
  script:
    - cd apps/web-admin
    - pnpm test:run
  coverage: '/Lines\s*:\s*\d+\.?\d+%/'
  artifacts:
    paths:
      - apps/web-admin/coverage/
    expire_in: 1 week

# ── Build image Docker (staging) ──────────────────────────────────────────────

build:web-admin:staging:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:web-admin"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/web-admin/**/*
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/apps/web-admin"
      --dockerfile "$CI_PROJECT_DIR/apps/web-admin/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/web-admin:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/web-admin:staging"
      --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_STAGING"
      --cache=true
      --cache-ttl=24h

build:web-admin:production:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:web-admin"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/apps/web-admin"
      --dockerfile "$CI_PROJECT_DIR/apps/web-admin/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/web-admin:$CI_COMMIT_TAG"
      --destination "$CI_REGISTRY_IMAGE/web-admin:latest"
      --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_PROD"
      --cache=true
      --cache-ttl=24h

# ── Deploy staging ────────────────────────────────────────────────────────────

deploy:web-admin:staging:
  stage: staging
  image: alpine:latest
  needs: ["build:web-admin:staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/web-admin/**/*
  environment:
    name: web-admin/staging
    url: $WEB_ADMIN_STAGING_URL
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -n "$WEB_ADMIN_STAGING_DEPLOY_HOOK" ]; then
        curl -f -s -X POST "$WEB_ADMIN_STAGING_DEPLOY_HOOK"
        echo "Deploy staging déclenché."
      else
        echo "WEB_ADMIN_STAGING_DEPLOY_HOOK non définie — deploy ignoré."
      fi

# ── Deploy production ─────────────────────────────────────────────────────────

deploy:web-admin:production:
  stage: production
  image: alpine:latest
  needs: ["build:web-admin:production"]
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-admin\/v.*/
      when: manual
  environment:
    name: web-admin/production
    url: $WEB_ADMIN_PROD_URL
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -n "$WEB_ADMIN_PROD_DEPLOY_HOOK" ]; then
        curl -f -s -X POST "$WEB_ADMIN_PROD_DEPLOY_HOOK"
        echo "Deploy production déclenché."
      else
        echo "WEB_ADMIN_PROD_DEPLOY_HOOK non définie — deploy ignoré."
      fi
